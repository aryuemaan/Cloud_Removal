# =============================================================================
# LISS-IV Generative Cloud Removal — Master Configuration
# =============================================================================

project:
  name: "liss4-cloud-removal"
  version: "1.0.0"
  seed: 42
  device: "cuda"          # cuda | cpu | mps
  num_workers: 8
  mixed_precision: true   # AMP training for throughput on industrial GPUs

paths:
  raw_data_dir: "data/raw"
  cloudy_dir: "data/raw/cloudy"
  cloud_free_dir: "data/raw/cloud_free"
  sar_dir: "data/raw/sentinel1_sar"
  s2_dir: "data/raw/sentinel2_optical"
  dem_dir: "data/raw/dem"
  processed_dir: "data/processed"
  patches_dir: "data/processed/patches"
  checkpoints_dir: "checkpoints"
  logs_dir: "logs"
  outputs_dir: "outputs"
  tensorboard_dir: "logs/tensorboard"

data:
  # LISS-IV: 4 bands (Green, Red, NIR, SWIR-ish via pan-sharpened variants); configurable
  liss4_bands: ["B2", "B3", "B4", "B5"]
  sar_bands: ["VV", "VH"]
  patch_size: 256
  patch_overlap: 32
  cloud_fraction_min: 0.05
  cloud_fraction_max: 0.85
  train_val_test_split: [0.8, 0.1, 0.1]
  normalization:
    method: "percentile"     # percentile | minmax | zscore
    lower_percentile: 1
    upper_percentile: 99
  augmentation:
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate90: 0.5
    brightness_contrast: 0.3
    gaussian_noise: 0.1

model:
  architecture: "sar_fusion_attention_gan"  # sar_fusion_attention_gan | diffusion | plain_unet
  generator:
    in_channels_optical: 4
    in_channels_sar: 2
    in_channels_mask: 1
    base_channels: 64
    depth: 5
    attention: "cbam"           # cbam | self_attention | none
    # Temporal fusion (stack of prior reference frames) is implemented in
    # src/models/generator.py::TemporalEncoder but requires a temporal
    # frame stack to be supplied by the dataset/dataloader, which the
    # reference data pipeline does not populate by default. Leave this
    # False unless you have wired up `temporal_stack` end-to-end (see
    # docs/architecture.md "Extending with temporal fusion").
    use_temporal: false
    temporal_frames: 3
  discriminator:
    type: "patchgan"
    in_channels: 4
    base_channels: 64
    n_layers: 3
  diffusion:
    timesteps: 1000
    beta_schedule: "cosine"
    sampling_steps: 50          # DDIM accelerated sampling

training:
  epochs: 200
  batch_size: 16
  lr_generator: 0.0002
  lr_discriminator: 0.0002
  beta1: 0.5
  beta2: 0.999
  lr_scheduler: "cosine"
  warmup_epochs: 5
  early_stopping_patience: 20
  checkpoint_every: 5
  validate_every: 1
  gradient_clip_norm: 5.0
  loss_weights:
    adversarial: 1.0
    l1_reconstruction: 100.0
    perceptual_vgg: 10.0
    ssim: 5.0
    spectral_angle: 5.0
    total_variation: 0.1
    cloud_mask_focus: 2.0   # extra weight on cloud-covered pixels

inference:
  sliding_window: true
  window_size: 256
  stride: 192
  blend_mode: "gaussian"   # gaussian | linear | none
  tta: true                # test-time augmentation (flips/rotations averaged)
  batch_size: 8

evaluation:
  metrics: ["psnr", "ssim", "sam", "rmse", "ergas", "mae"]
  save_visual_comparisons: true
  num_visual_samples: 20

logging:
  level: "INFO"
  use_wandb: false
  wandb_project: "liss4-cloud-removal"
  use_tensorboard: true
